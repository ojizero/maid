# maid config.
# maid ships these defaults inside the binary. The user file
# ($XDG_CONFIG_HOME/maid/config.toml, else ~/.config/maid/config.toml,
# or the file given with -c) adds to them:
#   - a [[target]] with the same name as a default replaces it;
#     a new name adds a target.
#   - keys in [worktrees] replace the default keys.
#   - [[worktrees.override]] entries from the user file are checked
#     before the default ones. The first match wins.
# Unknown keys and bad values are errors.

# ── Targets ──────────────────────────────────────────────────────
# A target is one thing on disk that maid measures and maybe cleans.
#   name             what the report calls it; --only selects by name
#   action           "clean" or "keep"
#   path             a folder; survey measures it with du -skx
#   size             or: a command that prints a size, for example "17.3GB"
#                    (decimal units as Docker prints them; empty = unknown)
#                    A target has exactly one of path and size.
#   dry_run          optional: a command that shows what clean would remove
#   clean            the command that frees it (action = "clean" only)
#   skip_if_running  do not clean while one of these programs runs
#   only_if          clean only when this command succeeds
#   why              the reason, shown in the report (required for "keep")
#
# Commands run with sh -c and stop after 10 minutes. A target whose path
# does not exist or is a symlink is skipped. skip_if_running and only_if are checked
# in survey and again just before clean runs.

# Package caches

[[target]]
name            = "Homebrew cache"
action          = "clean"
path            = "~/Library/Caches/Homebrew"
dry_run         = "brew cleanup --prune=all --dry-run"
clean           = "brew cleanup --prune=all"
skip_if_running = ["brew"]

[[target]]
name            = "uv cache"
action          = "clean"
path            = "~/.cache/uv"
clean           = "uv cache clean"
skip_if_running = ["uv"]

[[target]]
name            = "npm cache"
action          = "clean"
path            = "~/.npm/_cacache"
clean           = "npm cache clean --force"
skip_if_running = ["npm"]

[[target]]
name            = "pnpm store"
action          = "clean"
path            = "~/Library/pnpm/store"
clean           = "pnpm store prune"
skip_if_running = ["pnpm"]

[[target]]
name            = "Bun cache"
action          = "clean"
path            = "~/.bun/install/cache"
clean           = "bun pm cache rm -g"
skip_if_running = ["bun"]

[[target]]
name            = "Go build cache"
action          = "clean"
path            = "~/Library/Caches/go-build"
clean           = "go clean -cache"
skip_if_running = ["go"]

[[target]]
name            = "NuGet packages"
action          = "clean"
path            = "~/.nuget/packages"
clean           = "dotnet nuget locals all --clear"
skip_if_running = ["dotnet"]

# Xcode

[[target]]
name            = "Xcode DerivedData"
action          = "clean"
path            = "~/Library/Developer/Xcode/DerivedData"
clean           = "rm -rf ~/Library/Developer/Xcode/DerivedData/*"
skip_if_running = ["Xcode", "xcodebuild"]

[[target]]
name            = "Unavailable simulators"
action          = "clean"
path            = "~/Library/Developer/CoreSimulator/Devices"
clean           = "xcrun simctl delete unavailable"
skip_if_running = ["Simulator"]

# Docker (cleaned only when Docker is already running)

[[target]]
name    = "Docker images"
action  = "clean"
size    = "docker system df --format '{{if eq .Type \"Images\"}}{{.Size}}{{end}}'"
clean   = "docker image prune --all --force"
only_if = "docker info"

[[target]]
name    = "Docker build cache"
action  = "clean"
size    = "docker system df --format '{{if eq .Type \"Build Cache\"}}{{.Size}}{{end}}'"
clean   = "docker builder prune --all --force"
only_if = "docker info"

[[target]]
name   = "Docker containers"
action = "keep"
size   = "docker system df --format '{{if eq .Type \"Containers\"}}{{.Size}}{{end}}'"
why    = "stopped containers can hold data"

[[target]]
name   = "Docker volumes"
action = "keep"
size   = "docker system df --format '{{if eq .Type \"Local Volumes\"}}{{.Size}}{{end}}'"
why    = "database and app data"

# Installed tools that live in cache folders

[[target]]
name   = "Playwright browsers"
action = "keep"
path   = "~/Library/Caches/ms-playwright"
why    = "installed browsers that tests use"

[[target]]
name   = "mise tools"
action = "keep"
path   = "~/.local/share/mise/installs"
why    = "installed runtimes; mise prune also uninstalls versions in use elsewhere"

# ── Worktrees ────────────────────────────────────────────────────
# repos: folders that hold your git repos. Survey finds each repo in them,
# then runs wt list to get every worktree of that repo, wherever it lives.
#
# The code always runs 3 checks before it removes a worktree:
#   integrated, no changes, ignored files are only build output.
# If one check fails, the worktree goes to Ask.
#
# delete_branch: what to do with the branch after the worktree is removed.
# It applies only to worktrees that the [worktrees] clean command removes,
# because that command keeps the branch (--no-delete-branch).
#   "pushed"      delete it when a remote branch contains its last commit
#                 (git branch -r --contains)
#   "integrated"  delete it (only integrated worktrees are removed)
#   "never"       keep it

[worktrees]
repos         = ["~/workspace"]
delete_branch = "pushed"
action        = "clean"
clean         = "wt -C {repo} remove --foreground --yes --no-delete-branch {path}"

# An [[worktrees.override]] entry replaces the [worktrees] action, why,
# dry_run and clean for worktrees whose path matches.
# Fields: name, path, action, why, dry_run, clean.
# In path, * matches one folder name and {name} matches one folder name
# and captures it for the commands.
#
# Commands can use {repo} (the main checkout), {path}, {branch} and the
# captures. maid shell-quotes every value it puts in, so do not put a
# placeholder inside quotes: that is a config error.

[[worktrees.override]]
name   = "T3"
path   = "~/.t3/worktrees/*/*"
action = "keep"
why    = "T3 removes these itself (Settings → Cleanup)"
