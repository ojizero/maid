name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: docker
    # wt needs git 2.43 or newer; bookworm, the runner's default, has 2.39.
    container:
      image: node:22-trixie
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/mise
      - run: mise run ci
