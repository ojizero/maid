name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  release:
    # The dist task cross-links with zig, which fails at random on the
    # Linux 4.4 kernel of the `docker` runner (no statx).
    runs-on: sagittarius-a
    # wt needs git 2.43 or newer; bookworm, the runner's default, has 2.39.
    container:
      image: node:22-trixie
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/mise
      - run: mise run release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A GitHub token that can write the contents of ojizero/maid.
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
